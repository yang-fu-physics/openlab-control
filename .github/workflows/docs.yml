name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "modules/**"
      - "system_instruments/**"
      - "src/labcontrol/module_api.py"
      - "src/labcontrol/measurement/frontend_api.py"
      - "src/labcontrol/instruments/base.py"
      - "src/labcontrol/models.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version label; empty uses pyproject.toml
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate documentation
        run: mkdocs build --strict

      - name: Configure documentation publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish versioned documentation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          project_version() {
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          }

          if [[ "$EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION:-$(project_version)}"
          else
            version="$(project_version)"
          fi

          # 当前只发布一个稳定站点。若旧的 dev 目录仍存在，发布时一并删除。
          if mike list -j dev >/dev/null 2>&1; then
            mike delete --push dev
          fi

          mike deploy --push --update-aliases --alias-type redirect "$version" stable
          mike set-default --push stable
