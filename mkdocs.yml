site_name: OpenLab Control
site_description: OpenLab Control 中文使用与扩展开发教程
site_url: https://yang-fu-physics.github.io/openlab-control/
repo_url: https://github.com/yang-fu-physics/openlab-control
repo_name: yang-fu-physics/openlab-control
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 OpenLab Control contributors
strict: true

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  icon:
    logo: material/flask-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: zh
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: sphinx
            heading_level: 2
            members_order: source
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
  - mike:
      canonical_version: stable

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yang-fu-physics/openlab-control
      name: OpenLab Control on GitHub

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 快速开始:
      - 路线图: getting-started/index.md
      - Windows 发布包: getting-started/windows.md
      - 源码环境: getting-started/source.md
      - 第一条 SEQ: getting-started/first-sequence.md
  - Measurement Module:
      - 扩展边界: development/index.md
      - 第一个测量模块: development/first-module.md
      - 多通道与测量结果: development/results-and-slots.md
      - Settings 与 Status: development/frontend.md
      - 自定义 SEQ 指令: development/sequence-commands.md
      - 仪表驱动分层: development/instrument-drivers.md
  - Device Plugin:
      - 开发温场设备插件: development/device-plugin.md
  - 测试与发布:
      - 测试策略: development/testing.md
      - 离线安装与发布: guides/offline-packaging.md
      - 仪表安全清单: guides/safety-checklist.md
      - 常见问题: guides/troubleshooting.md
      - 参与核心开发: guides/contributing.md
  - 参考:
      - 公共 Python API: reference/public-api.md
      - SEQ 格式: SEQUENCE_FORMAT.md
      - DAT 与事件格式: DAT_FORMAT.md
      - 配置参考: CONFIGURATION.md
      - 系统架构: ARCHITECTURE.md
      - 完整扩展规范: PLUGIN_DEVELOPMENT.md
      - 操作手册: OPERATIONS.md
