id = "simulated_temperature"
name = "Simulated Temperature"
version = "1.0.0"
api_version = "4"
backend = "labcontrol.instruments.simulated:SimulatedTemperatureController"
kinds = ["temperature"]

[[controls]]
id = "main"
label = "Simulated Temperature"

[[panels]]
id = "main"
label = "Simulated Temperature"
template = "controller"
control = "main"
reading_options = ["value"]
default_reading = "value"
min_value = 1.8
max_value = 400.0
default_rate_per_minute = 10.0
max_rate_per_minute = 30.0
stability_tolerance = 0.05
stability_max_slope_per_minute = 0.03
stability_dwell_seconds = 1.5
stability_timeout_seconds = 120.0
stability_window_seconds = 1.0

[readings.value]
label = "Simulated Temperature"
unit = "K"
decimals = 3

[[instances]]
id = "temperature"
initial_value = 300.0
noise = 0.00005

[[instances.panels]]
id = "main"
enabled = true
order = 1
role = "sample_temp"
reading = "value"
min_value = 1.8
max_value = 400.0
default_rate_per_minute = 10.0
max_rate_per_minute = 30.0
stability_tolerance = 0.05
stability_max_slope_per_minute = 0.03
stability_dwell_seconds = 1.5
stability_timeout_seconds = 120.0
stability_window_seconds = 1.0
