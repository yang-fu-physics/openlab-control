[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openlab-control"
version = "0.17.1"
description = "Low-temperature, magnetic-field and modular measurement control framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "QtAwesome==1.4.2",
    "packaging==26.2",
    "PyVISA==1.16.2",
    "typing_extensions==4.16.0",
]

[project.scripts]
openlab-control = "labcontrol.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
