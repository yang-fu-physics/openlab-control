[application]
title = "OpenLab Control"
ui_scale = "auto"
ui_refresh_ms = 200
poll_interval_seconds = 0.20
simulation_speed = 120.0
default_sequence = "examples/nested_scan.seq"
language = "en_US"

[logging]
directory = "runs"
data_file_name = "experiment.dat"
event_file_name = "events.dat"
device_status_file_name = "device_status.dat"
device_status_interval_seconds = 1.0
timestamp_epoch = "labview_1904"
flush_every_row = true
allow_external_paths = false

[abort]
temperature = "hold_current"
field = "hold_current"

[alarms]
stability_timeout = "error"
stale_reading = "warning"
popup_warnings = true
popup_errors = true

[alarms.reporting]
enabled = false
endpoint = "http://127.0.0.1:3889/alarm/report"
token_env = "OPENLAB_ALARM_TOKEN"
token_file = ""
timeout_seconds = 3.0
retry_attempts = 3
retry_delay_seconds = 1.0
queue_size = 100
shutdown_timeout_seconds = 2.0
allow_insecure_http = false

[modules]
directory = "modules"
data_directory = "module_data"
shared_wheels_directory = "wheels"
python_executable = ""
runtime_directory = "plugin_runtime"
startup_timeout_seconds = 10.0
operation_timeout_seconds = 120.0
shutdown_timeout_seconds = 3.0

[plugins]
device_directory = "device_plugins"
state_directory = "plugin_state"
runtime_directory = "plugin_runtime"
shared_wheels_directory = "wheels"
python_executable = ""
device_startup_timeout_seconds = 10.0
device_reconnect_timeout_seconds = 60.0
device_reconnect_interval_seconds = 2.0

[[devices]]
id = "temperature"
display_name = "Temperature"
kind = "temperature"
plugin = "labcontrol.devices.simulated:SimulatedTemperatureController"
role = "primary"
control_enabled = true
unit = "K"
initial_value = 300.0
default_rate_per_minute = 10.0
min_value = 1.8
max_value = 400.0
max_rate_per_minute = 30.0
operation_timeout_seconds = 10.0
shutdown_timeout_seconds = 3.0
stability_tolerance = 0.05
stability_max_slope_per_minute = 0.03
stability_dwell_seconds = 1.5
stability_timeout_seconds = 120.0
stability_window_seconds = 1.0
noise = 0.00005

[[devices]]
id = "field"
display_name = "Magnetic Field"
kind = "field"
plugin = "labcontrol.devices.simulated:SimulatedFieldController"
role = "primary"
control_enabled = true
unit = "Oe"
initial_value = 0.0
default_rate_per_minute = 5000.0
min_value = -90000.0
max_value = 90000.0
max_rate_per_minute = 10000.0
operation_timeout_seconds = 10.0
shutdown_timeout_seconds = 3.0
stability_tolerance = 20.0
stability_max_slope_per_minute = 10.0
stability_dwell_seconds = 1.0
stability_timeout_seconds = 120.0
stability_window_seconds = 0.8
noise = 0.01

[[devices]]
id = "second_stage"
display_name = "2nd Stage"
kind = "monitor"
plugin = "labcontrol.devices.simulated:SimulatedReadOnlyMonitor"
role = "monitor"
control_enabled = false
unit = "K"
initial_value = 4.2
operation_timeout_seconds = 10.0
shutdown_timeout_seconds = 3.0
noise = 0.002
